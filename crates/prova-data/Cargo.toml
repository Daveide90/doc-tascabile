[package]
name = "tascabile-prova-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# L'impronta SHA-256 dei file e dei passi della prova: già nel lock, portata dai motori.
sha2 = "0.11.1"
# SHA-1 e RIPEMD-160 delle prove vecchie (l'esempio pubblico del 2015 usa RIPEMD-160): già nel lock
# e già nell'app, portati dalla firma dei PDF.
sha1 = "0.11.0"
ripemd = "0.2.0"
